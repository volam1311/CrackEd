server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Variable + Docker DNS so nginx can start even if the API
    # container is not on this network (client-only docker run).
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend "http://server:8000";
        proxy_pass $backend;

        # The upload UI accepts files up to 5 GB. nginx defaults to 1 MB, which
        # rejects every real video with a 413 before it ever reaches FastAPI.
        client_max_body_size 5G;

        # Stream the body straight through instead of spooling the whole upload
        # to a temp file first, and allow time for a large transfer.
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
